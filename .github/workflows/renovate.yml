---
name: Renovate

on:
    workflow_dispatch:
    schedule:
        - cron: "00 9 * * *"

concurrency:
    group: renovate-${{ github.repository }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    renovate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Renovate
              uses: renovatebot/github-action@7b402fe76b7bc4273576663a09be2f0f85266e2f # v47.0.0
              env:
                  LOG_LEVEL: info
                  RENOVATE_TOKEN: ${{ secrets.RENOVATE_PAT }}
                  RENOVATE_REPOSITORIES: ${{ github.repository }}
              with:
                  renovate-version: 44.16.1
